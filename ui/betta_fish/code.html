<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Elegant Glow -->
    <filter id="betta-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0d9488" flood-opacity="0.25" />
    </filter>

    <!-- Gradients: Elegant Cyan to Deep Indigo/Violet -->
    <linearGradient id="betta-body" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="betta-fin-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.75" />
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="betta-fin-flowing" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Background tranquil aura -->
  <circle cx="200" cy="200" r="170" fill="#f0fdfa" opacity="0.6"/>
  <circle cx="200" cy="200" r="150" fill="#f5f3ff" opacity="0.45"/>

  <!-- Betta Splendens Illustration -->
  <g filter="url(#betta-shadow)" transform="translate(5, -5)">
    <!-- Majestic Flowing Tail Fin (Grand silk veil) -->
    <!-- Outer veil layer -->
    <path d="M 220 195 C 270 120 345 95 375 135 C 395 165 370 220 375 255 C 380 295 320 305 270 270 C 235 245 225 210 220 195 Z" 
          fill="url(#betta-fin-primary)" />
    <!-- Secondary translucent silk folds -->
    <path d="M 225 190 C 285 130 335 125 355 155 C 370 180 345 210 355 240 C 340 270 285 260 235 205 Z" 
          fill="url(#betta-fin-flowing)" />
    <path d="M 230 195 C 290 155 330 160 340 185 C 345 205 320 225 325 245 C 295 250 250 225 230 195 Z" 
          fill="#ffffff" opacity="0.25" />

    <!-- Regal Dorsal Fin (Crest on top) -->
    <path d="M 125 155 C 145 95 210 85 245 125 C 215 145 175 155 140 165 Z" fill="url(#betta-fin-primary)" />
    <path d="M 140 145 C 160 105 205 100 230 130 C 200 142 168 152 140 145 Z" fill="url(#betta-fin-flowing)" opacity="0.7" />

    <!-- Ventral Long Ribbons / Pelvic fins (Classic Betta streamers) -->
    <path d="M 155 225 C 165 285 180 325 190 335 C 188 320 175 280 165 235 Z" fill="url(#betta-fin-primary)" />
    <path d="M 145 220 C 150 270 160 305 168 315 C 165 295 155 265 150 228 Z" fill="url(#betta-fin-flowing)" />

    <!-- Anal Under Fin (long flowing bottom veil) -->
    <path d="M 170 230 C 215 285 260 275 270 255 C 255 240 230 225 210 215 Z" fill="url(#betta-fin-primary)" />

    <!-- Sleek, Graceful Betta Body -->
    <path d="M 90 190 C 90 155 130 145 180 155 C 225 165 242 185 235 205 C 225 228 180 238 140 232 C 105 225 90 210 90 190 Z" 
          fill="url(#betta-body)" />

    <!-- Pearlescent Scales Highlight -->
    <path d="M 115 175 C 140 165 185 170 215 190 C 190 185 150 180 125 195 Z" fill="#5eead4" opacity="0.5" />

    <!-- Delicate Cheek Blush -->
    <ellipse cx="120" cy="202" rx="12" ry="8" fill="#f43f5e" opacity="0.35" />

    <!-- Intelligent, Elegant Eye -->
    <circle cx="115" cy="178" r="9" fill="#0f172a" />
    <circle cx="112" cy="175" r="3.5" fill="#ffffff" />
    <circle cx="117" cy="180" r="1.5" fill="#ffffff" opacity="0.8" />

    <!-- Proud Gentle Lips -->
    <path d="M 90 192 C 85 191 84 195 89 197" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Waving Pectoral Fin -->
    <path d="M 135 200 C 145 228 165 235 170 225 C 172 215 158 202 145 195 Z" fill="url(#betta-fin-flowing)" opacity="0.9" />
  </g>

  <!-- Elegant crystal water pearls/bubbles -->
  <circle cx="70" cy="155" r="5" fill="#2dd4bf" opacity="0.35" />
  <circle cx="68" cy="153" r="2" fill="#ffffff" opacity="0.75" />
  <circle cx="58" cy="138" r="7" fill="#2dd4bf" opacity="0.25" />
  <circle cx="56" cy="135" r="2.5" fill="#ffffff" opacity="0.8" />
  <circle cx="82" cy="120" r="4" fill="#2dd4bf" opacity="0.3" />
</svg>
