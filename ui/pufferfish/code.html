<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Soft Puffer Glow and Shadow -->
    <filter id="puffer-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.2" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="puffer-back-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="puffer-belly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <linearGradient id="puffer-fin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Background gentle aura -->
  <circle cx="200" cy="200" r="170" fill="#f0fdf4" opacity="0.5"/>
  <circle cx="200" cy="200" r="150" fill="#e0f2fe" opacity="0.4"/>

  <!-- Pufferfish Main -->
  <g filter="url(#puffer-shadow)" transform="translate(0, 5)">
    <!-- Tail Fin (tiny, vibrating cute tail) -->
    <path d="M 285 195 C 325 175 340 165 345 180 C 338 198 338 202 345 220 C 340 235 325 225 285 205 Z" fill="url(#puffer-fin)" />

    <!-- Cute soft round spines poking out around the back -->
    <circle cx="160" cy="102" r="5" fill="#0284c7" opacity="0.8" />
    <circle cx="200" cy="105" r="5.5" fill="#0284c7" opacity="0.8" />
    <circle cx="240" cy="118" r="5" fill="#0284c7" opacity="0.8" />
    <circle cx="272" cy="145" r="5" fill="#0284c7" opacity="0.8" />
    <circle cx="285" cy="178" r="4.5" fill="#0284c7" opacity="0.8" />

    <!-- Cute bottom spines -->
    <circle cx="150" cy="293" r="5" fill="#38bdf8" opacity="0.6" />
    <circle cx="195" cy="298" r="5.5" fill="#38bdf8" opacity="0.6" />
    <circle cx="240" cy="288" r="5" fill="#38bdf8" opacity="0.6" />

    <!-- Perfectly Round Puffed Body -->
    <circle cx="195" cy="200" r="95" fill="url(#puffer-back-grad)" />

    <!-- White Creamy Belly (Bottom half curve) -->
    <path d="M 102 215 C 105 268 150 295 195 295 C 242 295 285 268 288 215 C 250 240 145 240 102 215 Z" fill="url(#puffer-belly-grad)" />

    <!-- Tiny cute decorative freckles/dots on back -->
    <circle cx="160" cy="135" r="4" fill="#0369a1" opacity="0.4" />
    <circle cx="185" cy="125" r="3" fill="#0369a1" opacity="0.35" />
    <circle cx="215" cy="130" r="4.5" fill="#0369a1" opacity="0.4" />
    <circle cx="245" cy="150" r="3.5" fill="#0369a1" opacity="0.35" />
    <circle cx="175" cy="155" r="3" fill="#0369a1" opacity="0.3" />
    <circle cx="205" cy="150" r="3.5" fill="#0369a1" opacity="0.3" />

    <!-- Blushing Pink Cheeks (super derpy & cute) -->
    <ellipse cx="130" cy="225" rx="14" ry="9" fill="#f43f5e" opacity="0.35" />

    <!-- Wide Derpy/Cute Eyes -->
    <g transform="translate(120, 175)">
      <circle cx="0" cy="0" r="11" fill="#0f172a" />
      <circle cx="-3" cy="-3.5" r="4.2" fill="#ffffff" />
      <circle cx="3" cy="3" r="1.8" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- Tiny Pouting 'O' Mouth -->
    <ellipse cx="102" cy="198" rx="5" ry="7" fill="#f97316" />
    <ellipse cx="103" cy="198" rx="2.8" ry="4.5" fill="#7c2d12" />

    <!-- Little Pectoral Side Fin (flapping like mad) -->
    <path d="M 175 210 C 185 190 205 195 208 208 C 210 220 188 228 175 210 Z" fill="#bae6fd" />
    <path d="M 177 210 C 183 196 198 200 200 209 C 201 216 186 222 177 210 Z" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Puffer bubbles escaping mouth -->
  <circle cx="82" cy="180" r="5" fill="#38bdf8" opacity="0.4" />
  <circle cx="80" cy="178" r="1.8" fill="#ffffff" opacity="0.7" />
  <circle cx="68" cy="162" r="7.5" fill="#38bdf8" opacity="0.35" />
  <circle cx="66" cy="159" r="2.5" fill="#ffffff" opacity="0.8" />
  <circle cx="52" cy="145" r="4" fill="#38bdf8" opacity="0.25" />
</svg>
