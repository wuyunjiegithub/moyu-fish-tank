<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Shadow & Glow -->
    <filter id="clown-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ea580c" flood-opacity="0.22" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="clown-orange" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="white-stripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="fin-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="80%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background gentle water halo -->
  <circle cx="200" cy="200" r="170" fill="#fef3c7" opacity="0.35"/>
  <circle cx="200" cy="200" r="150" fill="#e0f2fe" opacity="0.45"/>

  <!-- Clownfish Main Illustration -->
  <g filter="url(#clown-shadow)" transform="translate(0, -2)">
    <!-- Tail Fin with black rounded trim -->
    <path d="M 270 195 C 310 165 338 162 342 178 C 344 190 332 195 332 205 C 332 215 344 220 342 232 C 338 248 310 245 270 215 Z" fill="url(#clown-orange)" />
    <!-- Tail black edge & white band -->
    <path d="M 330 176 C 340 186 340 224 330 234 C 335 220 335 190 330 176 Z" fill="#1e293b" />
    <path d="M 282 188 C 290 185 292 225 282 222 Z" fill="#ffffff" />

    <!-- Dorsal Fin (top rounded with black edge) -->
    <path d="M 145 152 C 165 110 220 115 235 152 Z" fill="url(#fin-orange)" />
    <path d="M 160 120 C 190 112 215 115 232 142 C 225 132 195 125 160 120 Z" fill="#1e293b" opacity="0.85" />

    <!-- Ventral Bottom Fins -->
    <path d="M 165 240 C 175 272 198 275 202 260 C 205 248 190 238 180 235 Z" fill="url(#fin-orange)" />

    <!-- Main Torpedo Body -->
    <path d="M 85 195 C 85 145 140 135 210 148 C 265 160 280 188 278 208 C 272 235 245 255 195 252 C 125 250 85 235 85 195 Z" 
          fill="url(#clown-orange)" />

    <!-- Characteristic White Stripes with delicate dark border (Anemone Clownfish) -->
    <!-- Stripe 1: Head Band -->
    <path d="M 130 142 C 145 142 145 248 130 248 C 118 248 116 142 130 142 Z" fill="url(#white-stripe)" stroke="#0f172a" stroke-width="2.5" />
    
    <!-- Stripe 2: Middle Saddle Band (curved bulge) -->
    <path d="M 195 147 C 220 148 215 252 195 252 C 182 252 185 147 195 147 Z" fill="url(#white-stripe)" stroke="#0f172a" stroke-width="2.5" />

    <!-- Stripe 3: Base of Tail Band -->
    <path d="M 255 178 C 265 178 265 232 255 232 C 248 232 248 178 255 178 Z" fill="url(#white-stripe)" stroke="#0f172a" stroke-width="2.5" />

    <!-- Blushing Cheek -->
    <ellipse cx="108" cy="214" rx="11" ry="8" fill="#f43f5e" opacity="0.4" />

    <!-- Big Curious Eye -->
    <circle cx="106" cy="180" r="10" fill="#0f172a" />
    <circle cx="103" cy="176" r="3.8" fill="#ffffff" />
    <circle cx="109" cy="183" r="1.6" fill="#ffffff" opacity="0.8" />

    <!-- Cute Smiling Mouth -->
    <path d="M 86 200 C 90 206 98 204 100 200" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Front Pectoral Fin (waving warmly) -->
    <path d="M 142 205 C 155 235 180 245 185 235 C 188 222 170 205 152 198 Z" fill="url(#fin-orange)" stroke="#0f172a" stroke-width="1.8" />
  </g>

  <!-- Happy little companion bubbles -->
  <circle cx="68" cy="165" r="5" fill="#38bdf8" opacity="0.35" />
  <circle cx="66" cy="163" r="2" fill="#ffffff" opacity="0.7" />
  <circle cx="52" cy="148" r="7" fill="#38bdf8" opacity="0.3" />
  <circle cx="50" cy="146" r="2.5" fill="#ffffff" opacity="0.8" />
  <circle cx="75" cy="130" r="3.5" fill="#38bdf8" opacity="0.25" />
</svg>
