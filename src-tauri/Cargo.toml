[package]
name = "moyu-fish-tank"
version = "0.1.0"
description = "摸，摸鱼 —— 把桌面当鱼缸的桌面伴侣"
authors = ["moyu"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "moyu_fish_tank_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
