<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="'Plus Jakarta Sans','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>成长曲线：0.62 倍到 1.00 倍体长，24 小时长满</title>

  <text x="70" y="28" font-size="18" font-weight="600" fill="#111d20">成长曲线：从幼鱼到成鱼</text>
  <text x="70" y="48" font-size="11" fill="#7e8c8f">体长倍率 = 0.62 + 0.38 × √(出生至今 ÷ 24 小时)，关掉软件也照常推进</text>

  <!-- 阶段底色 -->
  <rect x="70" y="60" width="66.3" height="260" fill="#e08e79" fill-opacity="0.09"/>
  <rect x="136.3" y="60" width="463.7" height="260" fill="#3a8e9a" fill-opacity="0.07"/>

  <!-- 横向网格 -->
  <g stroke="#dcecef" stroke-width="1" stroke-dasharray="4 4">
    <path d="M70 265.3 H600"/>
    <path d="M70 196.8 H600"/>
    <path d="M70 128.4 H600"/>
    <path d="M70 60 H600"/>
  </g>

  <!-- 坐标轴 -->
  <g stroke="#bec8ca" stroke-width="1.4">
    <path d="M70 60 V320"/>
    <path d="M70 320 H600"/>
  </g>
  <text x="30" y="196" font-size="11" fill="#7e8c8f" transform="rotate(-90,30,196)" text-anchor="middle">体长倍率</text>

  <!-- 纵轴刻度 -->
  <g font-size="11" fill="#7e8c8f" text-anchor="end">
    <text x="62" y="324">0.62×</text>
    <text x="62" y="269">0.70×</text>
    <text x="62" y="201">0.80×</text>
    <text x="62" y="132">0.90×</text>
    <text x="62" y="64">1.00×</text>
  </g>

  <!-- 横轴刻度 -->
  <g font-size="11" fill="#7e8c8f" text-anchor="middle">
    <text x="70" y="338">出生</text>
    <text x="136.3" y="338">3h</text>
    <text x="202.5" y="338">6h</text>
    <text x="335" y="338">12h</text>
    <text x="467.5" y="338">18h</text>
    <text x="600" y="338">24h</text>
  </g>

  <!-- 曲线 -->
  <polyline fill="none" stroke="#006671" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="70,320 92.1,266.9 114.2,244.9 136.3,228.1 158.3,213.9 180.4,201.3 202.5,190 224.6,179.6 246.7,169.9 268.8,160.8 290.8,152.2 312.9,144 335,136.2 357.1,128.6 379.2,121.4 401.3,114.5 423.3,107.7 445.4,101.2 467.5,94.8 489.6,88.7 511.7,82.7 533.8,76.8 555.8,71.1 577.9,65.5 600,60"/>

  <!-- 阶段切换点 -->
  <circle cx="136.3" cy="228.1" r="4" fill="#ffffff" stroke="#006671" stroke-width="2.4"/>
  <circle cx="600" cy="60" r="4.5" fill="#006671"/>

  <!-- 阶段条 -->
  <rect x="70" y="350" width="66.3" height="20" rx="6" fill="#e08e79" fill-opacity="0.2"/>
  <rect x="136.3" y="350" width="463.7" height="20" rx="6" fill="#3a8e9a" fill-opacity="0.16"/>
  <rect x="606" y="350" width="48" height="20" rx="6" fill="#006671" fill-opacity="0.16"/>
  <g font-size="11" text-anchor="middle">
    <text x="103" y="364" fill="#8c4938">幼鱼</text>
    <text x="368" y="364" fill="#3a8e9a">亚成</text>
    <text x="630" y="364" fill="#006671">成鱼</text>
  </g>

  <text x="70" y="392" font-size="11" fill="#7e8c8f">出生时间写进存档，所以关掉软件、重启电脑都不会让鱼「重新变小」</text>
</svg>