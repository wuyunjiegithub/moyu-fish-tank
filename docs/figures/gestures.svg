<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 296" width="912" height="296" font-family="'Plus Jakarta Sans','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>鼠标手势三态：悬停抚摸、单击躲开、双击绝活</title>

  <defs>
    <g id="gfish">
      <path d="M30 -3 L56 -22 Q61 0 56 22 Z" fill="#fb923c"/>
      <ellipse cx="0" cy="0" rx="30" ry="17" fill="#ff6b6b"/>
      <path d="M-8 -14 Q6 -28 20 -12 Z" fill="#fde047"/>
      <path d="M-30 6 Q-16 20 0 16" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-19" cy="-3" r="2.8" fill="#1b2a2e"/>
    </g>
    <path id="heart" d="M6 11 C2 8 0 6 0 3.6 C0 1.6 1.6 0 3.6 0 C4.8 0 5.6 0.6 6 1.3 C6.4 0.6 7.2 0 8.4 0 C10.4 0 12 1.6 12 3.6 C12 6 10 8 6 11 Z" fill="#e08e79"/>
  </defs>

  <!-- ======================= 面板一 · 悬停 · 抚摸 ======================= -->
  <g transform="translate(16,16)">
    <rect width="284" height="240" rx="18" fill="#f9fdfe" stroke="#dcecef"/>
    <rect x="16" y="16" width="118" height="26" rx="13" fill="#006671" fill-opacity="0.08"/>
    <text x="30" y="34" font-size="13" font-weight="600" fill="#006671">悬停 · 抚摸</text>

    <!-- 手左右晃动的轨迹 -->
    <path d="M92 62 Q128 42 164 62" fill="none" stroke="#76a9ab" stroke-width="1.8" stroke-dasharray="5 4"/>
    <path d="M92 62 102.2 58.05 97.4 49.35Z" fill="#76a9ab"/>
    <path d="M164 62 153.7 58 158.5 49.3Z" fill="#76a9ab"/>

    <!-- 白手套手型（同 PetHand.tsx） -->
    <g transform="translate(112,86) scale(1.75)" fill="#ffffff" stroke="#1e293b" stroke-opacity="0.32" stroke-width="0.9" stroke-linejoin="round">
      <rect x="4" y="6" width="4" height="12" rx="2"/>
      <rect x="9" y="3" width="4" height="15" rx="2"/>
      <rect x="14" y="6" width="4" height="12" rx="2"/>
      <rect x="19" y="9" width="4" height="9" rx="2"/>
      <rect x="-1" y="14" width="6" height="7" rx="3"/>
      <rect x="0" y="18" width="22" height="12" rx="5"/>
      <rect x="7" y="27" width="9" height="5" rx="2.5"/>
    </g>

    <use href="#gfish" transform="translate(58,182) scale(0.82)"/>
    <use href="#heart" transform="translate(152,166) scale(1.05)"/>
    <use href="#heart" transform="translate(184,130) scale(0.9)"/>
    <use href="#heart" transform="translate(168,202) scale(0.72)"/>

    <text x="142" y="224" font-size="12" text-anchor="middle" fill="#7e8c8f">手一靠近就凑过来，还会冒小爱心</text>
  </g>

  <!-- ======================= 面板二 · 单击 · 躲开 ======================= -->
  <g transform="translate(314,16)">
    <rect width="284" height="240" rx="18" fill="#f9fdfe" stroke="#dcecef"/>
    <rect x="16" y="16" width="118" height="26" rx="13" fill="#006671" fill-opacity="0.08"/>
    <text x="30" y="34" font-size="13" font-weight="600" fill="#006671">单击 · 躲开</text>

    <!-- 窜出去的速度线 -->
    <g stroke="#83d3e0" stroke-width="2.6" stroke-linecap="round">
      <path d="M40 168 H128" opacity="0.55"/>
      <path d="M52 186 H140" opacity="0.8"/>
      <path d="M40 204 H124" opacity="0.55"/>
      <path d="M66 152 H118" opacity="0.35"/>
    </g>

    <!-- 点击落点 -->
    <circle cx="96" cy="120" r="13" fill="#e08e79" fill-opacity="0.12" stroke="#e08e79" stroke-opacity="0.5"/>
    <circle cx="96" cy="120" r="4" fill="#e08e79"/>

    <!-- 受惊甩出的水花 -->
    <circle cx="146" cy="140" r="3" fill="#83d3e0"/>
    <circle cx="136" cy="152" r="2.2" fill="#83d3e0"/>
    <circle cx="158" cy="130" r="2.4" fill="#83d3e0"/>

    <g transform="translate(206,186) scale(-0.82,0.82)">
      <use href="#gfish"/>
    </g>

    <text x="142" y="224" font-size="12" text-anchor="middle" fill="#7e8c8f">受惊一窜，尾巴甩出水花</text>
  </g>

  <!-- ======================= 面板三 · 双击 · 绝活 ======================= -->
  <g transform="translate(612,16)">
    <rect width="284" height="240" rx="18" fill="#f9fdfe" stroke="#dcecef"/>
    <rect x="16" y="16" width="118" height="26" rx="13" fill="#006671" fill-opacity="0.08"/>
    <text x="30" y="34" font-size="13" font-weight="600" fill="#006671">双击 · 绝活</text>

    <circle cx="142" cy="138" r="48" fill="#006671" fill-opacity="0.04" stroke="#83d3e0" stroke-width="2" stroke-dasharray="7 7"/>
    <g stroke="#fde047" stroke-width="2.6" stroke-linecap="round">
      <path d="M196 138 H208"/>
      <path d="M180.2 175.8 188.7 184.3"/>
      <path d="M142 186 142 198"/>
      <path d="M103.8 175.8 95.3 184.3"/>
      <path d="M88 138 H76"/>
      <path d="M103.8 100.2 95.3 91.7"/>
      <path d="M142 90 142 78"/>
      <path d="M180.2 100.2 188.7 91.7"/>
    </g>

    <use href="#gfish" transform="translate(142,138) scale(0.72)"/>

    <text x="142" y="218" font-size="11" text-anchor="middle" fill="#7e8c8f">金鱼转圈 · 小丑鱼吐泡</text>
    <text x="142" y="234" font-size="11" text-anchor="middle" fill="#7e8c8f">斗鱼甩尾 · 河豚胀球</text>
  </g>

  <text x="456" y="286" font-size="12" text-anchor="middle" fill="#7e8c8f">三种手势互不打架：双击会抢在单击前判定，所以摸摸鱼时不会被当成「受惊躲开」</text>
</svg>